<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat Colaborativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de carga ultrarrápida (Splash screen) -->
    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-mask" viewBox="0 0 100 100" width="140" height="140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Rostro pálido estructurado -->
                <path d="M50 6 C26 6 18 24 18 52 C18 75 34 92 50 97 C66 92 82 75 82 52 C82 24 74 6 50 6 Z" fill="#EAEAEA" stroke="#000" stroke-width="2"/>
                
                <!-- Ojos afilados y rasgados (mirada siniestra) -->
                <path d="M26 43 Q37 38 46 44 Q37 46 26 43 Z" fill="#050505"/>
                <path d="M74 43 Q63 38 54 44 Q63 46 74 43 Z" fill="#050505"/>
                
                <!-- Cejas agresivas muy arqueadas -->
                <path d="M24 35 Q35 24 46 36" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M76 35 Q65 24 54 36" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
                
                <!-- Mejillas sonrosadas de porcelana -->
                <ellipse cx="26" cy="55" rx="6" ry="3.5" fill="#E06D6D" opacity="0.6"/>
                <ellipse cx="74" cy="55" rx="6" ry="3.5" fill="#E06D6D" opacity="0.6"/>
                
                <!-- Bigote clásico estilizado con puntas afiladas hacia arriba -->
                <path d="M50 64 C42 61 28 58 18 50 C23 57 36 67 50 68 C64 67 77 57 82 50 C72 58 58 61 50 64 Z" fill="#000"/>
                
                <!-- Sonrisa marcada e intimidante -->
                <path d="M30 68 Q50 82 70 68" stroke="#8E2A3E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                <path d="M28 66 Q30 70 33 68" stroke="#000" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <path d="M72 66 Q70 70 67 68" stroke="#000" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                
                <!-- Perilla puntiaguda -->
                <path d="M47 77 L53 77 L50 91 Z" fill="#000"/>
            </svg>
            <div class="splash-text">CONNECTING...</div>
        </div>
    </div>

    <div id="top-bar">
        <div id="users-list"></div>
        <div class="header-right">
            <div id="typing-indicator"></div>
            <!-- Botón de configuración con máscara de Vendetta inline -->
            <button id="admin-btn" class="admin-btn" title="Configuración">
              <svg viewBox="0 0 100 100" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Rostro pálido estructurado -->
                <path d="M50 6 C26 6 18 24 18 52 C18 75 34 92 50 97 C66 92 82 75 82 52 C82 24 74 6 50 6 Z" fill="#EAEAEA" stroke="#000" stroke-width="2"/>
                
                <!-- Ojos afilados y rasgados (mirada siniestra) -->
                <path d="M26 43 Q37 38 46 44 Q37 46 26 43 Z" fill="#050505"/>
                <path d="M74 43 Q63 38 54 44 Q63 46 74 43 Z" fill="#050505"/>
                
                <!-- Cejas agresivas muy arqueadas -->
                <path d="M24 35 Q35 24 46 36" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M76 35 Q65 24 54 36" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
                
                <!-- Mejillas sonrosadas de porcelana -->
                <ellipse cx="26" cy="55" rx="6" ry="3.5" fill="#E06D6D" opacity="0.6"/>
                <ellipse cx="74" cy="55" rx="6" ry="3.5" fill="#E06D6D" opacity="0.6"/>
                
                <!-- Bigote clásico estilizado con puntas afiladas hacia arriba -->
                <path d="M50 64 C42 61 28 58 18 50 C23 57 36 67 50 68 C64 67 77 57 82 50 C72 58 58 61 50 64 Z" fill="#000"/>
                
                <!-- Sonrisa marcada e intimidante -->
                <path d="M30 68 Q50 82 70 68" stroke="#8E2A3E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                <path d="M28 66 Q30 70 33 68" stroke="#000" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                <path d="M72 66 Q70 70 67 68" stroke="#000" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                
                <!-- Perilla puntiaguda -->
                <path d="M47 77 L53 77 L50 91 Z" fill="#000"/>
              </svg>
            </button>
        </div>
    </div>
    
    <!-- Historial de mensajes -->
    <div id="chat-container">
        <div id="messages-list"></div>
    </div>
    
    <!-- Entrada de texto -->
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="send-button">Enviar</button>
    </div>

    <!-- Modal Contraseña -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <h3>Acceso Restringido</h3>
            <p id="password-error" style="color: #ff5252; font-size: 13px; display: none; margin: 0;">Acceso denegado</p>
            <input type="password" id="admin-password" placeholder="Contraseña">
            <div class="modal-actions">
                <button class="modal-btn" id="cancel-password">Cancelar</button>
                <button class="modal-btn" id="submit-password">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Configuración -->
    <div id="config-modal" class="modal">
        <div class="modal-content">
            <h3>Configuración del Servidor</h3>
            <button id="clear-chat-btn" class="danger-btn">Borrar todo el chat</button>
            <div class="modal-actions" style="margin-top: 10px;">
                <button class="modal-btn" id="close-config">Cerrar</button>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
