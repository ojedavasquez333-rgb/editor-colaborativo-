<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat Colaborativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de carga ultrarrápida (Splash screen) -->
    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-mask" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C7 2 4 6 4 12c0 5 2 7 4 9 1.5 1.5 3 0 4 0s2.5 1.5 4 0c2-2 4-4 4-9 0-6-3-10-8-10z"></path>
                <path d="M7 10c1.5-1 3.5 0 4 1"></path>
                <path d="M17 10c-1.5-1-3.5 0-4 1"></path>
                <path d="M8 14.5c2 1.5 6 1.5 8 0"></path>
                <path d="M10 16.5c1 1 3 1 4 0"></path>
                <path d="M12 17.5v2.5"></path>
            </svg>
            <div class="splash-text">CONNECTING...</div>
        </div>
    </div>

    <div id="top-bar">
        <div id="users-list"></div>
        <div class="header-right">
            <div id="typing-indicator"></div>
            <!-- Ícono de la máscara de Vendetta -->
            <div id="admin-icon" title="Opciones de Administrador">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C7 2 4 6 4 12c0 5 2 7 4 9 1.5 1.5 3 0 4 0s2.5 1.5 4 0c2-2 4-4 4-9 0-6-3-10-8-10z"></path>
                    <path d="M7 10c1.5-1 3.5 0 4 1"></path>
                    <path d="M17 10c-1.5-1-3.5 0-4 1"></path>
                    <path d="M8 14.5c2 1.5 6 1.5 8 0"></path>
                    <path d="M10 16.5c1 1 3 1 4 0"></path>
                    <path d="M12 17.5v2.5"></path>
                </svg>
            </div>
        </div>
    </div>
    
    <!-- Historial de mensajes -->
    <div id="chat-container">
        <div id="messages-list"></div>
    </div>
    
    <!-- Entrada de texto -->
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="send-button">Enviar</button>
    </div>

    <!-- Modal Contraseña -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <h3>Acceso Restringido</h3>
            <p id="password-error" style="color: #ff5252; font-size: 13px; display: none; margin: 0;">Acceso denegado</p>
            <input type="password" id="admin-password" placeholder="Contraseña">
            <div class="modal-actions">
                <button class="modal-btn" id="cancel-password">Cancelar</button>
                <button class="modal-btn" id="submit-password">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Configuración -->
    <div id="config-modal" class="modal">
        <div class="modal-content">
            <h3>Configuración del Servidor</h3>
            <button id="clear-chat-btn" class="danger-btn">Borrar todo el chat</button>
            <div class="modal-actions" style="margin-top: 10px;">
                <button class="modal-btn" id="close-config">Cerrar</button>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
